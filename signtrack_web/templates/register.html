{% extends "base.html" %}
{% block title %}Register - SignTrack{% endblock %}
{% block content %}
<div class="container" style="max-width:400px;margin:3rem auto;">
    <div class="text-center mb-3">
        <h2>Create Account</h2>
        <p style="color:var(--gray-600);">Join SignTrack and start controlling your desktop</p>
    </div>
    <form method="POST">
        <div class="form-group">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
        </div>
        <div class="form-group">
            <label for="confirm" class="form-label">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" class="form-control" placeholder="Confirm your password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">
            Create Account
        </button>
    </form>
    <div class="text-center mt-3">
        <p>Already have an account? <a href="{{ url_for('login') }}" style="color:var(--primary-color);font-weight:500;">Sign in here</a></p>
    </div>
    {% if error %}
        <div class="alert alert-error mt-3">
            {{ error }}
        </div>
    {% endif %}
</div>
{% endblock %}
